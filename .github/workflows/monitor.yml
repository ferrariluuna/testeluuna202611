name: Monitor Luuna

on:
  schedule:
    - cron: "*/10 * * * *"   # checagens HTTP a cada 10 min (mínimo permitido: 5)
    - cron: "5 * * * *"      # checagem em navegador real, de hora em hora
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo de checagem"
        type: choice
        options: [http, browser]
        default: http

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '5 * * * *' && 'browser' || 'http') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Instalar Chromium
        if: env.MODE == 'browser'
        run: playwright install --with-deps chromium
      - name: Restaurar histórico
        run: |
          git fetch origin data --depth=1 && git checkout FETCH_HEAD -- data && rm -rf docs/data && mv data docs/data || true
          mkdir -p docs/data
      - name: Rodar monitor
        run: python monitor.py --mode "$MODE"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Salvar histórico (branch data, sem inchar o repositório)
        run: |
          D=$(mktemp -d); cp -r docs/data "$D/data"; cd "$D"
          git init -q -b data
          git config user.name "sentinel-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git commit -qm "dados $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
