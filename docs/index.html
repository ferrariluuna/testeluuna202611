<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luuna · Monitoramento</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14171c;--mut:#6a7280;--bd:#e4e7ec;--up:#15803d;--deg:#b45309;--down:#dc2626;--none:#d1d5db;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--card:#171a21;--tx:#e8eaee;--mut:#8b93a1;--bd:#272c36;--up:#4ade80;--deg:#fbbf24;--down:#f87171;--none:#3a404c}}
:root[data-theme="dark"]{--bg:#0e1014;--card:#171a21;--tx:#e8eaee;--mut:#8b93a1;--bd:#272c36;--up:#4ade80;--deg:#fbbf24;--down:#f87171;--none:#3a404c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:1.1rem;max-width:1200px;margin-inline:auto}
h1{font-size:1.25rem;margin:0}h2{font-size:.95rem;margin:1.5rem 0 .6rem}.sub{color:var(--mut);font-size:.8rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin:1rem 0}
.kpi,.card,.tw{background:var(--card);border:1px solid var(--bd);border-radius:10px}.kpi{padding:.8rem 1rem}
.kpi b{display:block;font-size:1.5rem}.kpi span{color:var(--mut);font-size:.75rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:.8rem}
.card{border-top:3px solid var(--c,var(--none));padding:.9rem 1rem}.card.up{--c:var(--up)}.card.degraded{--c:var(--deg)}.card.down{--c:var(--down)}
.row{display:flex;justify-content:space-between;gap:.5rem}.pill{color:var(--c);font-weight:700;font-size:.7rem;text-transform:uppercase}
.url{color:var(--mut);font-size:.74rem;word-break:break-all}.m{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:.7rem 0 .3rem}
.m b{display:block;font-size:.95rem}.m span{color:var(--mut);font-size:.66rem}.spark{width:100%;height:36px;color:var(--c,var(--mut));display:block}
.iss{font-size:.76rem;margin-top:.3rem;color:var(--deg)}.iss.critical{color:var(--down)}
.hist{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:.7rem 1rem;margin-bottom:.6rem}
.strip{display:flex;gap:2px;margin-top:.4rem}.strip i{flex:1;height:22px;border-radius:2px;background:var(--none);min-width:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
td,th{padding:.55rem .75rem;border-bottom:1px solid var(--bd);text-align:left;font-size:.8rem;vertical-align:top}th{color:var(--mut)}tr:last-child td{border-bottom:0}
a{color:inherit}
</style>
</head>
<body>
<h1>🛰️ Luuna · Monitoramento</h1>
<div class="sub" id="upd">Carregando…</div>
<div class="kpis" id="kpis"></div>
<div class="grid" id="grid"></div>
<h2>Disponibilidade nos últimos 30 dias</h2><div id="hist"></div>
<h2>Incidentes</h2><div class="tw"><table id="inc"></table></div>
<h2>Relatórios diários</h2><div id="rep" class="sub"></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = async n => { try { const r = await fetch("data/" + n + ".json?t=" + Date.now()); return r.ok ? await r.json() : null; } catch (e) { return null; } };
const fmt = t => t ? new Date(t * 1000).toLocaleString("pt-BR", {dateStyle:"short", timeStyle:"short"}) : "em andamento";
const label = {up:"no ar", degraded:"degradado", down:"com problema"};
function spark(v) {
  v = (v || []).map(x => x || 0); if (v.length < 2) return "";
  const mx = Math.max(...v, 1);
  return `<svg class="spark" viewBox="0 0 100 36" preserveAspectRatio="none"><polyline fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" points="${v.map((y, i) => (i / (v.length - 1) * 100).toFixed(1) + "," + (33 - y / mx * 30).toFixed(1)).join(" ")}"/></svg>`;
}
async function load() {
  const [st, inc, daily, reps] = await Promise.all(["status", "incidents", "daily", "reports"].map(get));
  if (!st) { document.getElementById("upd").textContent = "Aguardando a primeira execução do monitor…"; return; }
  const S = st.sites, mins = Math.max(0, Math.round((Date.now() / 1000 - st.generated) / 60));
  document.getElementById("upd").textContent = `Atualizado há ${mins} min · checagens automáticas a cada 10 min (GitHub Actions)`;
  const ok = S.filter(s => s.state === "up").length, ms = S.filter(s => s.total_ms).map(s => s.total_ms);
  const ups = S.filter(s => s.uptime != null).map(s => s.uptime);
  document.getElementById("kpis").innerHTML = [
    [ok + "/" + S.length, "páginas no ar"],
    [ups.length ? (ups.reduce((a, b) => a + b, 0) / ups.length).toFixed(2) + "%" : "—", "uptime médio 24h"],
    [ms.length ? Math.round(ms.reduce((a, b) => a + b, 0) / ms.length) + " ms" : "—", "carregamento médio"],
    [(inc || []).filter(i => !i.ended).length, "incidentes abertos"]
  ].map(k => `<div class="kpi"><b>${esc(k[0])}</b><span>${k[1]}</span></div>`).join("");
  document.getElementById("grid").innerHTML = S.map(s => `<div class="card ${esc(s.state)}">
    <div class="row"><b>${esc(s.name)}</b><span class="pill">${label[s.state] || "aguardando"}</span></div>
    <div class="url">${esc(s.url)}</div>
    <div class="m"><div><b>${s.status ?? "—"}</b><span>HTTP</span></div><div><b>${s.total_ms ?? "—"}${s.total_ms ? " ms" : ""}</b><span>carga</span></div>
    <div><b>${s.ttfb_ms ?? "—"}${s.ttfb_ms ? " ms" : ""}</b><span>TTFB</span></div><div><b>${s.uptime ?? "—"}%</b><span>uptime 24h</span></div></div>
    ${spark(s.spark)}<div class="url">redirects: ${s.hops ?? 0} · SSL: ${s.ssl_days ?? "—"}${s.ssl_days ? " dias" : ""}</div>
    ${(s.issues || []).map(i => `<div class="iss ${esc(i[0])}">⚠ ${esc(i[2])}</div>`).join("")}</div>`).join("");
  const days = Object.keys(daily || {}).sort().slice(-30);
  document.getElementById("hist").innerHTML = S.map(s => `<div class="hist"><b>${esc(s.name)}</b><div class="strip">${days.map(d => {
    const x = daily[d][s.name]; if (!x) return `<i title="${d}: sem dados"></i>`;
    const u = 100 * x.ok / x.n, c = u >= 99.9 ? "up" : u >= 99 ? "deg" : "down";
    return `<i style="background:var(--${c})" title="${d}: ${u.toFixed(2)}% · média ${x.cnt ? Math.round(x.sum / x.cnt) : "—"} ms"></i>`;
  }).join("") || "<i></i>"}</div></div>`).join("");
  document.getElementById("inc").innerHTML = "<tr><th>Página<th>Início<th>Fim<th>Motivo<th>Diagnóstico IA</tr>" +
    ((inc || []).slice(0, 30).map(i => `<tr><td>${esc(i.site)}<td>${fmt(i.started)}<td>${fmt(i.ended)}<td>${esc(i.reason)}<td>${esc(i.diagnosis || "—")}</tr>`).join("") || "<tr><td colspan=5>Nenhum incidente 🎉</tr>");
  document.getElementById("rep").innerHTML = (reps || []).map(f => `<div><a href="data/reports/${esc(f)}" target="_blank">${esc(f)}</a></div>`).join("") || "Nenhum relatório ainda (o primeiro sai após o horário configurado).";
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
